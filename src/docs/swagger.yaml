openapi: 3.0.3
info:
  title: E-Commerce API
  version: 1.0.0
  description: REST API for an e-commerce backend built with Node.js and Express.

servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://ecommerce-api-bgwl.onrender.com
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserDTO'

    ProductDTO:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
        category:
          type: string
        images:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    CartItemDTO:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/ProductDTO'
        quantity:
          type: integer
        subtotal:
          type: number

    CartDTO:
      type: object
      properties:
        id:
          type: string
        user:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemDTO'
        totalPrice:
          type: number
        createdAt:
          type: string
          format: date-time

    CartResponse:
      type: object
      properties:
        cart:
          $ref: '#/components/schemas/CartDTO'

    OrderItemDTO:
      type: object
      properties:
        product:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/ProductDTO'
        quantity:
          type: integer
        price:
          type: number
        subtotal:
          type: number

    OrderDTO:
      type: object
      properties:
        id:
          type: string
        user:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/UserDTO'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDTO'
        totalAmount:
          type: number
        status:
          type: string
          enum: [pending, paid, shipped, delivered, cancelled]
        createdAt:
          type: string
          format: date-time
        isCancelable:
          type: boolean

    CancelOrderResponse:
      type: object
      properties:
        message:
          type: string
        order:
          $ref: '#/components/schemas/OrderDTO'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [user, admin]
                  default: user
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        400:
          description: Registration error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        400:
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products:
    get:
      tags: [Products]
      summary: Get all products
      responses:
        200:
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDTO'

    post:
      tags: [Products]
      summary: Create product (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, description, price, stock, category]
              properties:
                title:
                  type: string
                description:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                category:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        201:
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/{productId}:
    put:
      tags: [Products]
      summary: Update product (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                category:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        200:
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        404:
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Products]
      summary: Delete product (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Product deleted
        404:
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cart:
    get:
      tags: [Cart]
      summary: Get logged-in user cart
      security:
        - bearerAuth: []
      responses:
        200:
          description: User cart returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'

    post:
      tags: [Cart]
      summary: Add product to cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
      responses:
        200:
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        400:
          description: Product not found or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cart/{productId}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        200:
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        404:
          description: Product not in cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Cart]
      summary: Remove item from cart
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Item removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        404:
          description: Product not in cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders:
    post:
      tags: [Orders]
      summary: Create order from cart
      security:
        - bearerAuth: []
      responses:
        201:
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        400:
          description: Cart empty or insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/my-orders:
    get:
      tags: [Orders]
      summary: Get logged-in user orders
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of orders belonging to the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderDTO'
        401:
          description: Unauthorized - Valid JWT required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get a single order by ID
      description: |
        Retrieves details for a specific order. 
        - **Regular Users:** Can only retrieve their own orders.
        - **Admins:** Can retrieve any order in the system.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          description: The unique MongoDB ObjectId of the order
          schema:
            type: string
            example: "65f2b3c4d5e6f7a8b9c0d1e2"
      responses:
        200:
          description: Order details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        400:
          description: Invalid Order ID format
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid order ID"

        401:
          description: Unauthorized - Authentication token is missing or invalid
        403:
          description: Forbidden - User is attempting to access an order that doesn't belong to them
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized: You do not own this order"
        404:
          description: Order not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Order not found"

  /api/orders/admin/all:
    get:
      summary: Get all orders in the system (Admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: A list of all orders across the entire platform
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '403':
          description: Forbidden - Admin role required

  /api/orders/{orderId}/cancel:
    patch:
      tags: [Orders]
      summary: Cancel an existing order
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        400:
          description: Cannot cancel order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Order not found